name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & smoke test (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config gcc g++ git ca-certificates \
            libwlroots-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libinput-dev libdrm-dev libgbm-dev libseat-dev \
            libpixman-1-dev libudev-dev libegl-dev libgles-dev libgl-dev \
            libxcb1-dev libxcb-render0-dev libxcb-xfixes0-dev \
            libxcb-icccm4-dev libxcb-composite0-dev libxcb-res0-dev \
            libxcb-ewmh-dev xwayland \
            libgtk-4-dev libgtk-4-bin python3-gi gir1.2-gtk-4.0 \
            libgirepository1.0-dev gobject-introspection \
            desktop-file-utils grim xvfb xterm gtk-4-examples \
            adwaita-icon-theme fonts-noto-cjk

      - name: Build gtk4-layer-shell (not packaged in Ubuntu)
        run: |
          git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr -Dexamples=false -Ddocs=false -Dvapi=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          pkg-config --modversion gtk4-layer-shell-0

      - name: Configure compositor
        run: meson setup build compositor

      - name: Compile compositor
        run: ninja -C build

      - name: Headless smoke test
        run: |
          export XDG_RUNTIME_DIR=/tmp/ed-runtime
          export WLR_BACKENDS=headless
          export WLR_RENDERER=pixman
          mkdir -p "$XDG_RUNTIME_DIR"
          # compositor must boot, open its IPC socket and survive 6 seconds
          timeout 6 ./build/elevende -s "sleep 4" > smoke.log 2>&1 || true
          grep -q "IPC listening" smoke.log
          grep -q "ElevenDE compositor running" smoke.log
          echo "SMOKE TEST PASSED"

      - name: Shell import test
        run: python3 -m py_compile shell/shell.py

      - name: Package release archive
        run: |
          mkdir -p dist/elevende
          cp -r compositor shell session assets docs README.md LICENSE install.sh dist/elevende/
          rm -rf dist/elevende/compositor/subprojects
          cp build/elevende dist/elevende/elevende-bin
          cd dist && zip -qr elevende-build.zip elevende && cd ..
          ls -la dist/

      - name: Upload compositor binary
        uses: actions/upload-artifact@v4
        with:
          name: elevende-compositor
          path: build/elevende

      - name: Upload full package
        uses: actions/upload-artifact@v4
        with:
          name: elevende-package
          path: dist/elevende-build.zip
