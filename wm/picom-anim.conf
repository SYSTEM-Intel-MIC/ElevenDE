# ElevenDE window animations for picom >= 12.
#
# The `animations` option only exists since picom v12-rc1 (Aug 2024);
# Debian 13 ships 12.5/13-1 while Ubuntu 24.04 still ships 10.x, which
# cannot parse this file. elevende-session therefore appends this snippet
# to picom.conf (or picom-mica.conf) at runtime ONLY when `picom --version`
# reports >= 12, and re-launches with the plain config if picom rejects the
# result -- old systems never see these keys.
#
# Style: Windows 11-ish. Windows grow slightly into place together with a
# fade instead of the old all-or-nothing fade, and shrink away on close.
# Presets `appear`/`disappear` are compiled into picom itself (their knobs
# scale/duration come from data/animation_presets.conf upstream).
animations = ({
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 0.96;
    duration = 0.22;
}, {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.96;
    duration = 0.16;
});
