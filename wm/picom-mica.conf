# ElevenDE Windows 11 Acrylic/Mica compositor profile.
# Keep the optional GLX profile conservative. Older Picom builds reject
# glx-no-stencil/glx-no-rebind-pixmap and open a warning dialog at login.
backend = "glx";
vsync = false;
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.28;
shadow-offset-x = -8;
shadow-offset-y = -8;
fading = true;
fade-in-step = 0.035;
fade-out-step = 0.035;
inactive-opacity = 1.0;
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
# Qt application content must remain fully opaque. Material effects are
# provided by their surfaces and shadows, not a global client opacity rule.
opacity-rule = [];
opacity-exclude = [ "class_g = 'elevende-lock'" ];
unredir-if-possible = false;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
corner-radius = 12;
rounded-corners-exclude = [ "class_g = 'elevende-shell'", "class_g = 'elevende-lock'" ];
