# ElevenDE compositor settings (picom)
#
# Maximum-compatibility config for any machine/driver:
# xrender backend (works on every X11 driver, no GPU-specific GLX/EGL
# glitches), shadows/fading off for consistent low latency, and a slight
# per-window transparency so apps feel "KDE-like".

backend = "xrender";
vsync = false;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.22;
shadow-offset-x = -5;
shadow-offset-y = -5;
no-dock-shadow = true;
no-dnd-shadow = true;

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-exclude = [ "class_g = 'xfdesktop'", "class_g = 'elevende-shell'" ];

inactive-opacity = 1.0;
# Keep all clients fully opaque. Translucency is deliberately not applied to
# application content because it can make Qt views look blank on some drivers.
opacity-rule = [];

# keep the shell's own windows fully solid
opacity-exclude = [ "class_g = 'elevende-shell'" ];

unredir-if-possible = false;

detect-transient = true;
detect-client-leader = true;
# use-damage borrows the Damage extension for repaint tracking; under some
# drivers it caused "window trails the cursor" and black-screen artifacts.
# Full repaints are slower but guaranteed stable on every hardware.
use-damage = false;

corner-radius = 12;
rounded-corners-exclude = [ "class_g = 'elevende-shell'" ];